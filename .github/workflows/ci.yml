name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - version-upgrade-0.70-to-0.84
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

  android:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets at Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Write signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/IntegratedApp.jks
          printf '%s\n' \
            "MYAPP_UPLOAD_STORE_FILE=../IntegratedApp.jks" \
            "MYAPP_UPLOAD_KEY_ALIAS=${ANDROID_KEY_ALIAS}" \
            "MYAPP_UPLOAD_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" \
            "MYAPP_UPLOAD_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" \
            > android/keystore.properties

      # Must run before the jcenter rewrite so this patch still matches the
      # published package (it removes the AGP 2.2.3 buildscript).
      - name: Patch react-native-fetch-blob
        run: patch -p1 --forward < patches/react-native-fetch-blob+0.10.8.patch

      # Gradle 9 removed jcenter(). Clean yarn installs still have it in old RN
      # libraries. The Groovy shim in settings.gradle cannot patch Gradle's
      # Java RepositoryHandler, so rewrite the Gradle files instead.
      - name: Replace jcenter() for Gradle 9
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updated = []
          for path in Path("node_modules").rglob("*"):
              if path.suffix not in {".gradle", ".kts"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if "jcenter()" not in text:
                  continue
              path.write_text(text.replace("jcenter()", "mavenCentral()"), encoding="utf-8")
              updated.append(str(path))
          print(f"replaced jcenter() in {len(updated)} files")
          for item in updated:
              print(f"  {item}")
          PY

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
