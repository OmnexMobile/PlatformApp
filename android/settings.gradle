pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = "IntegratedApp"
include(":app")
includeBuild("../node_modules/@react-native/gradle-plugin")
include(":react-native-community_slider")
project(":react-native-community_slider").projectDir = file("../node_modules/@react-native-community/slider/android")
include(":react-native-geocoder")
project(":react-native-geocoder").projectDir = file("../node_modules/react-native-geocoder/android")
include(":react-native-compressor")
project(":react-native-compressor").projectDir = file("../node_modules/react-native-compressor/android")
include(":react-native-image-marker")
project(":react-native-image-marker").projectDir = file("../node_modules/react-native-image-marker/android")
include(":react-native-pager-view")
project(":react-native-pager-view").projectDir = file("../node_modules/react-native-pager-view/android")
