// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

def REACT_NATIVE_VERSION = new File(['node', '--print',"JSON.parse(require('fs').readFileSync(require.resolve('react-native/package.json'), 'utf-8')).version"].execute(null, rootDir).text.trim())

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        // React Native 0.71+ no longer ships Android AARs inside node_modules.
        // Artifacts are published to Maven Central, so the following lines are
        // usually not needed and can prevent resolving com.facebook.react from Maven Central.
        // If you are using an older React Native version (<0.71), uncomment these:
        // maven { url "$rootDir/../node_modules/react-native/android" }
        // maven { url "$rootDir/../node_modules/jsc-android/dist" }
    }

    // Force a compatible version of androidx.browser to avoid AGP/compileSdk mismatch
    configurations.all {
        resolutionStrategy{
            // force 'androidx.browser:browser:1.9.0'
            // force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
            force 'androidx.browser:browser:1.5.0'
            force 'androidx.core:core:1.12.0'
            force 'androidx.core:core-ktx:1.12.0'
        
        }
    }
}

