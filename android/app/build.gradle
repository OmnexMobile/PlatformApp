apply plugin: "com.android.application"
apply plugin: "com.facebook.react"


react {
    /* RN build config */
    // Hermes is disabled (from your old setup)
    hermesEnabled = false

    // Optional: specify entry file if not index.js
    // entryFile = file("../index.js")
}


/**
 * Enable Proguard for release builds
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore fallback
 */
def jscFlavor = 'org.webkit:android-jsc:+'


android {
    namespace "com.Omnex.IntegratedApp"
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.Omnex.IntegratedApp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.2"
        multiDexEnabled true
        missingDimensionStrategy 'react-native-camera', 'general'
        manifestPlaceholders = [appAuthRedirectScheme: 'com.omnex.auditpro']
    }

    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

}
// FIX for react-native-vector-icons Gradle 8.x implicit dependency issue
gradle.projectsEvaluated {
    def lintTask = tasks.findByName('lintVitalAnalyzeRelease')
    def copyTask = tasks.findByName('copyReactNativeVectorIconFonts')

    if (lintTask != null && copyTask != null) {
        lintTask.dependsOn(copyTask)
    }
}
dependencies {
    // Core React Native dependency (handled by new Gradle plugin)
    implementation("com.facebook.react:react-android")
    implementation 'com.github.eventtus:photo-editor-android:v1.0'
    implementation project(':react-native-bootsplash')
    // Splash screen support
    implementation "androidx.core:core-splashscreen:1.0.0"


    // Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // Annotations
    implementation 'org.jetbrains:annotations:16.0.2'
    // Debugging (Flipper)
    debugImplementation("com.facebook.flipper:flipper:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.fbjni'
    }
    debugImplementation("com.facebook.flipper:flipper-network-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.flipper'
        exclude group:'com.squareup.okhttp3', module:'okhttp'
    }
    debugImplementation("com.facebook.flipper:flipper-fresco-plugin:${FLIPPER_VERSION}") {
        exclude group:'com.facebook.flipper'
    }

    // JSC instead of Hermes
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
